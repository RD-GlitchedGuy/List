<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mathe-Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div class="boss-bar-container">
            <div class="boss-bar" id="bossBar"></div>
            <div class="boss-bar-text" id="bossBarText">0 / 5 Aufgaben</div>
        </div>
        
        <div class="aufgabe" id="aufgabeText">Lade...</div>
        
        <input type="number" id="antwortInput" placeholder="?" oninput="pruefeAutomatisch()" autofocus autocomplete="off">
        <button class="skip-btn" onclick="ueberspringen()">Aufgabe überspringen ➔</button>

        <div id="feedback"></div>
    </div>

    <div class="ui-rechts-unten">
        <button class="shop-btn" onclick="oeffneShop()">🛒</button>
        <div class="coin-score" id="scoreAnzeige">
            <div class="muenz-modell"></div> 
            <span id="scoreWert">0</span>
        </div>
    </div>

    <!-- Shop Overlay -->
    <div class="shop-overlay" id="shopOverlay">
        <div class="shop-inhalt">
            <h2>🛒 Upgrade Shop</h2>
            
            <div class="shop-kategorie-titel">🎨 Hintergründe</div>
            <div id="hintergrundShopListe"></div>

            <div class="shop-kategorie-titel">🎵 Musik</div>
            <div id="musikShopListe"></div>
            
            <button class="shop-schliessen" onclick="schliesseShop()">Schließen</button>
        </div>
    </div>

    <!-- Cheat Overlay -->
    <div class="cheat-overlay" id="cheatOverlay">
        <div class="cheat-inhalt">
            <h2 style="color: #ff1744;">Cheat-Menü</h2>
            <p>Code erfolgreich eingegeben! Wähle eine Option:</p>
            
            <div class="shop-item">
                <span>Erhalte sofort 1.000 Münzen</span>
                <button class="cheat-action-btn" onclick="cheatAddCoins()">+1000 Coins</button>
            </div>
            <div class="shop-item">
                <span>Setze den gesamten Spielstand zurück</span>
                <button class="cheat-action-btn danger" onclick="cheatResetScore()">Reset auf 0</button>
            </div>
            
            <button class="cheat-schliessen" onclick="schliesseCheat()">Schließen</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
