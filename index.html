<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Websites & Games</title>
<style>
/* Dunkles/Schwarzes Farbschema */
:root {
  --bg: #0a0c0b;
  --ink: #f0f4f3;
  --muted: #889993;
  --card: #141a18;
  --line: #222e2a;
  --accent: #2dd4bf;
  --btn-active: #2563eb;
  --btn-danger: #dc2626;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:32px 20px 64px}

/* Keyframe-Animationen */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Info-Modal / Overlay Styling */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  opacity: 1;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.modal-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  max-width: 600px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
  animation: fadeInUp 0.3s ease forwards;
}
.modal-card h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.6rem;
  margin: 0 0 12px;
  color: var(--accent);
}
.modal-card p {
  color: var(--ink);
  font-size: 0.95rem;
  margin: 0 0 24px;
  line-height: 1.6;
  white-space: pre-line;
}
.modal-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.modal-btn {
  border: none;
  padding: 10px 20px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}
.modal-btn.primary {
  background: var(--btn-active);
  color: #ffffff;
}
.modal-btn.secondary {
  background: var(--line);
  color: var(--ink);
}
.modal-btn:hover {
  transform: scale(1.03);
  filter: brightness(1.1);
}
.modal-btn:active {
  transform: scale(0.97);
}

/* Kompakter & Zentrierter Tab-Umschalter */
.tab-container {
  display: flex;
  max-width: 320px;
  margin: 0 auto 24px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 3px;
  border-radius: 10px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.tab-btn:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.05);
}
.tab-btn:active {
  transform: scale(0.96);
}
.tab-btn.active {
  background: var(--btn-active);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
}

h1{font-family:Georgia,"Times New Roman",serif;font-size:2.4rem;margin:0 0 6px}
p.sub{margin:0 0 32px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}

/* Animation & Hover für Listen-Einträge */
li {
  display: flex;
  align-items: stretch;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  opacity: 0;
  animation: fadeInUp 0.4s ease forwards;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
li:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

a.link{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 14px;color:inherit;text-decoration:none}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}

/* Bild-Zoom bei Hover */
.ico{flex:none;width:64px;height:64px;border-radius:10px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:1.5rem;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s ease}
li:hover .ico img {
  transform: scale(1.08);
}

.txt{min-width:0}
.name{font-weight:700;display:block}
.dom{color:var(--muted);font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

aside.stats{max-width:680px;margin:0 auto;padding:0 20px 48px}
@media (min-width:1100px){aside.stats{position:fixed;top:48px;right:24px;width:260px;max-width:none;margin:0;padding:0}}
.stats-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stats h2{font-family:Georgia,"Times New Roman",serif;font-size:1.3rem;margin:0 0 12px}
.stats .label{color:var(--muted);font-size:.85rem;margin:0}
.stats .top{font-weight:700;font-size:1.2rem;color:var(--accent);margin:2px 0 0}
.stats .top-count{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.stats .chart{display:flex;align-items:flex-end;gap:8px;height:190px}
.stats .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;position:relative}
.stats .val{font-size:.85rem;font-weight:700;margin-bottom:4px}

/* Statistik-Balken Animation */
.stats .sail {
  width: 100%;
  max-width: 44px;
  min-height: 3px;
  background: var(--accent);
  border-radius: 6px 6px 0 0;
  transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.stats .nm{font-size:.7rem;color:var(--muted);line-height:1.2;margin-top:6px;height:2.4em;overflow:hidden;word-break:break-word}

/* Interaktiver Stunden-Chart mit fließendem Linien-Hover */
#tages-chart-container {
  position: relative;
  cursor: crosshair;
}
.hourly-hover-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  pointer-events: none;
  display: none;
  z-index: 5;
  transform: translateX(-50%);
}
.hourly-tooltip {
  position: absolute;
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--ink);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  pointer-events: none;
  display: none;
  z-index: 10;
  transform: translate(-50%, -130%);
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.7);
}
</style>

<!-- Firebase App + Firestore SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- INFO POPUP -->
<div id="info-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 id="modal-titel">Hinweis</h2>
    <p id="modal-text">Möchtest du diese Seite jetzt öffnen?</p>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="schliesseInfo()">Abbrechen</button>
      <button class="modal-btn primary" onclick="bestaetigeWeiterleitung()">Öffnen</button>
    </div>
  </div>
</div>

<!-- WOCHENSTATUS MODAL -->
<div id="wochenstatus-modal" class="modal-overlay hidden">
  <div class="modal-card" style="max-width: 600px; text-align: left;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 id="wochenstatus-titel" style="margin: 0;">Wochenstatus</h2>
      <button class="modal-btn secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="schliesseWochenstatus()">✕</button>
    </div>
    <ul id="wochenstatus-liste" style="max-height: 360px; overflow-y: auto; display: grid; gap: 10px; padding-right: 4px;"></ul>
  </div>
</div>

<!-- TAGES-DETAIL MODAL (Stunden-Ansicht) -->
<div id="tages-detail-modal" class="modal-overlay hidden">
  <div class="modal-card" style="max-width: 620px;">
    <h2 id="tages-titel">Stunden-Statistik</h2>
    <p id="tages-untertitel" style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;"></p>

    <div class="stats" style="padding: 0; margin-bottom: 20px;">
      <div id="tages-chart-container" class="stats-box" style="box-shadow: none; border: none; background: rgba(255,255,255,0.03);">
        <div class="chart" id="tages-chart" style="height: 180px; gap: 2px;"></div>
        <div id="hourly-line" class="hourly-hover-line"></div>
        <div id="hourly-tooltip" class="hourly-tooltip"></div>
      </div>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn primary" onclick="schliesseTagesDetail()">Schließen</button>
    </div>
  </div>
</div>

<main>
  <!-- ZENTRIERTER KATEGORIE UMSCHALTER -->
  <div class="tab-container" role="tablist">
    <button class="tab-btn active" id="tab-games" onclick="setKategorie('games')">Games</button>
    <button class="tab-btn" id="tab-useful" onclick="setKategorie('useful')">Nützliche Webseiten</button>
  </div>

  <h1 id="titel">Games</h1>
  <p class="sub" id="untertitel">Wähle ein Game aus</p>
  <ul id="liste"></ul>
</main>
<aside class="stats" id="stats" aria-label="Statistik"></aside>

<script>
/* ============================================================
   INFO MODAL STEUERUNG
   ============================================================ */
let zielUrl = "";
let zielId = "";

function starteLinkAufruf(e, item) {
  e.preventDefault();

  if (item.zeigeInfo === false) {
    zaehle(item.id);
    setTimeout(() => {
      window.location.href = item.url;
    }, 200);
    return;
  }

  zielUrl = item.url;
  zielId = item.id;

  document.getElementById("modal-titel").textContent = item.name;
  document.getElementById("modal-text").textContent = item.infoText || `Du wirst zu "${item.name}" weitergeleitet. Möchtest du fortfahren?`;
  
  document.getElementById("info-modal").classList.remove("hidden");
}

function bestaetigeWeiterleitung() {
  if (zielUrl) {
    zaehle(zielId);
    const urlToOpen = zielUrl;
    schliesseInfo();
    setTimeout(() => {
      window.location.href = urlToOpen;
    }, 200);
  } else {
    schliesseInfo();
  }
}

function schliesseInfo() {
  document.getElementById("info-modal").classList.add("hidden");
  zielUrl = "";
  zielId = "";
}

/* ============================================================
   FIRESTORE KONFIGURATION
   ============================================================ */
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  projectId: "liste-29c5c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================================================
   SEITEN-DATEN
   ============================================================ */
const SEITEN = [
  // --- GAMES ---
  { 
    id: "ffa_shooter",          
    kategorie: "games",  
    name: "FFA Shooter",          
    url: "https://rd-glitchedguy.github.io/FFA/",                       
    bild: "FFA.png",
    zeigeInfo: true,
    infoText: "Achtung: Alle Inhalte auf dieser Website sind öffentlich einsehbar und nicht privat!"
  },
  { 
    id: "flight_simulator",     
    kategorie: "games",  
    name: "Flight Simulator",     
    url: "https://rd-glitchedguy.github.io/Flight-sim/",                
    bild: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTD_funnaBtOevhYKQY0RKC0b7S52W2sycNQ-Hrxzb5xw&s=10",
    zeigeInfo: false
  },
  { 
    id: "ballman",            
    kategorie: "games",  
    name: "Ballman",            
    url: "https://tewe444.github.io/ball-man/",                        
    bild: "ball-man.png",
    zeigeInfo: false
  },
  { 
    id: "pizza_simulator",            
    kategorie: "games",  
    name: "Pizza Simulator",            
    url: "https://tewe444.github.io/Pizza/",                        
    bild: "Pizza.png",
    zeigeInfo: false
  },  
  { 
    id: "crazy_games",          
    kategorie: "games",  
    name: "Crazy Games",          
    url: "https://crazygames.com",                                      
    bild: "https://play-lh.googleusercontent.com/zGvYCipVc-uIpRVf6P5maUThHJyuNE35Y-tQCQz6tYigWuxlZThhQh0Te8G0SlLi1j8PAgHds8EkL2KXkKPG=s256-rw",
    zeigeInfo: false
  },
  {
    id: "cube_dasher",            
    kategorie: "games", 
    name: "Cube Dasher",            
    url: "https://rd-glitchedguy.github.io/Cube-Dasher/",                                       
    bild: "Cube Dasher.png",
    zeigeInfo: false,
  }
  // --- NÜTZLICHE WEBSEITEN ---
  { 
    id: "live-chat",            
    kategorie: "useful", 
    name: "Live Chat",            
    url: "https://tewe444.github.io/live-chat/",                                       
    bild: "chat-icon.png",
    zeigeInfo: true,
    infoText: "Achtung: Alle Inhalte auf dieser Website sind öffentlich einsehbar und nicht privat!"
  },
  {
    id: "duolingoweb",            
    kategorie: "useful", 
    name: "DuolingoWeb",            
    url: "https://www.duolingo.com/",                                       
    bild: "https://developer.android.com/static/images/distribute/stories/duolingo-icon.png?hl=de",
    zeigeInfo: false,
  },
  {
    id: "wann-ist",            
    kategorie: "useful", 
    name: "WannIst",            
    url: "https://tewe444.github.io/wann-ist/",                                       
    bild: "wann-ist.png",
    zeigeInfo: false,
  },
  {
    id: "glücksrad",            
    kategorie: "useful", 
    name: "Glücksrad",            
    url: "https://tewe444.github.io/Gl-cksrad/",                                       
    bild: "Glücksrad.png",
    zeigeInfo: false,
  }
];

const liste = document.getElementById("liste");
const statsBox = document.getElementById("stats");
const titel = document.getElementById("titel");
const untertitel = document.getElementById("untertitel");

let aktiveKategorie = "games";
let datenbankZaehler = {};

function setKategorie(kat) {
  aktiveKategorie = kat;
  document.getElementById("tab-games").classList.toggle("active", kat === "games");
  document.getElementById("tab-useful").classList.toggle("active", kat === "useful");

  if (kat === "games") {
    titel.textContent = "Games";
    untertitel.textContent = "Wähle ein Game aus";
  } else {
    titel.textContent = "Nützliche Webseiten";
    untertitel.textContent = "Wähle eine Webseite aus";
  }

  zeichne();
}

function zaehle(id) {
  const docRef = db.collection("stats").doc(id);
  const now = new Date();
  const tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const jsDay = now.getDay();
  const tagKey = tage[jsDay === 0 ? 6 : jsDay - 1];
  const hourKey = String(now.getHours());

  // Wir speichern nur noch die Stunden und den Gesamtwähler
  docRef.set({
    clicks: firebase.firestore.FieldValue.increment(1),
    [`hours.${tagKey}.${hourKey}`]: firebase.firestore.FieldValue.increment(1)
  }, { merge: true });
}

/* ============================================================
   BERECHNET TAGE AUTOMATISCH AUS DEN STUNDEN
   ============================================================ */
function getHourClicks(data, tag, hour) {
  if (!data) return 0;
  if (data.hours && data.hours[tag] && typeof data.hours[tag][hour] === 'number') return data.hours[tag][hour];
  if (typeof data[`hours.${tag}.${hour}`] === 'number') return data[`hours.${tag}.${hour}`];
  return 0;
}

function getDayClicks(data, tag) {
  let sum = 0;
  for (let h = 0; h < 24; h++) {
    sum += getHourClicks(data, tag, String(h));
  }
  return sum;
}

function getKlicks(id) {
  const data = datenbankZaehler[id] || {};
  if (typeof data.clicks === 'number') return data.clicks;
  const tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let sum = 0;
  tage.forEach(tag => {
    sum += getDayClicks(data, tag);
  });
  return sum;
}

function sortiert() {
  return SEITEN
    .filter(s => s.kategorie === aktiveKategorie)
    .map((s, i) => ({ s, i, n: getKlicks(s.id) }))
    .sort((a, b) => b.n - a.n || a.i - b.i);
}

function zeichneStats() {
  const rang = sortiert();
  const max = rang[0] ? rang[0].n : 0;
  const summe = rang.reduce((acc, curr) => acc + curr.n, 0);
  const isOverflow = max > 999;

  statsBox.textContent = "";
  const box = document.createElement("div"); box.className = "stats-box";
  const h = document.createElement("h2"); 
  h.textContent = aktiveKategorie === "games" ? "Statistik" : "Statistik";
  box.append(h);

  const l = document.createElement("p"); l.className = "label"; l.textContent = "Insgesamt meist genutzt";
  const t = document.createElement("p"); t.className = "top";
  const c = document.createElement("p"); c.className = "top-count";
  
  if (max > 0) {
    t.textContent = rang[0].s.name;
    if (isOverflow) {
      const topProzent = summe ? Math.round((max / summe) * 100) : 0;
      c.textContent = topProzent + "% aller Klicks";
    } else {
      c.textContent = max + "× von allen genutzt";
    }
  } else {
    t.textContent = "–";
    c.textContent = "Noch nichts aufgerufen";
  }
  box.append(l, t, c);

  const chart = document.createElement("div"); chart.className = "chart";
  let anzeige = rang;
  if (rang.length > 5) {
    const restSumme = rang.slice(4).reduce((acc, curr) => acc + curr.n, 0);
    anzeige = rang.slice(0, 4).concat([{ s: { name: "Andere" }, n: restSumme }]);
  }
  const maxBalken = Math.max(0, ...anzeige.map(r => r.n));
  for (const r of anzeige) {
    const col = document.createElement("div"); col.className = "col"; col.title = r.s.name;
    const val = document.createElement("span"); val.className = "val";
    
    if (isOverflow) {
      const prozent = summe ? Math.round((r.n / summe) * 100) : 0;
      val.textContent = prozent + "%";
    } else {
      val.textContent = r.n;
    }

    const sail = document.createElement("div"); sail.className = "sail";
    sail.style.height = (maxBalken ? Math.round(r.n / maxBalken * 140) : 0) + "px";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.s.name;
    col.append(val, sail, nm);
    chart.append(col);
  }
  box.append(chart);

  if (aktiveKategorie === "games") {
    const btnWochenstatus = document.createElement("button");
    btnWochenstatus.className = "modal-btn primary";
    btnWochenstatus.style.width = "100%";
    btnWochenstatus.style.marginTop = "16px";
    btnWochenstatus.textContent = "Wochenstatus";
    btnWochenstatus.onclick = oeffneWochenstatus;
    box.append(btnWochenstatus);
  }

  statsBox.append(box);
}

/* ============================================================
   WOCHENSTATUS & STUNDEN-DETAIL STEUERUNG
   ============================================================ */
function oeffneWochenstatus() {
  const listeEl = document.getElementById("wochenstatus-liste");
  listeEl.textContent = "";

  document.getElementById("wochenstatus-titel").textContent = "Wochenstatus";

  const tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  
  const gamesSeiten = SEITEN
    .filter(s => s.kategorie === "games")
    .map((s, i) => ({ s, i, n: getKlicks(s.id) }))
    .sort((a, b) => b.n - a.n || a.i - b.i)
    .map(item => item.s);

  gamesSeiten.forEach(s => {
    const li = document.createElement("li");
    li.style.display = "flex";
    li.style.alignItems = "center";
    li.style.justifyContent = "space-between";
    li.style.background = "var(--bg)";
    li.style.border = "1px solid var(--line)";
    li.style.borderRadius = "10px";
    li.style.padding = "10px 14px";
    li.style.gap = "10px";

    const leftDiv = document.createElement("div");
    leftDiv.style.display = "flex";
    leftDiv.style.alignItems = "center";
    leftDiv.style.gap = "12px";
    leftDiv.style.minWidth = "0";

    const ico = document.createElement("span");
    ico.className = "ico";
    ico.style.width = "40px";
    ico.style.height = "40px";
    ico.style.fontSize = "1.1rem";
    if (s.bild) {
      const img = document.createElement("img");
      img.src = s.bild;
      img.alt = "";
      img.onerror = () => { ico.textContent = s.name.charAt(0).toUpperCase(); };
      ico.append(img);
    } else {
      ico.textContent = s.name.charAt(0).toUpperCase();
    }

    const nameSpan = document.createElement("span");
    nameSpan.style.fontWeight = "700";
    nameSpan.style.fontSize = "0.95rem";
    nameSpan.style.overflow = "hidden";
    nameSpan.style.textOverflow = "ellipsis";
    nameSpan.style.whiteSpace = "nowrap";
    nameSpan.textContent = s.name;

    leftDiv.append(ico, nameSpan);

    const daysDiv = document.createElement("div");
    daysDiv.style.display = "flex";
    daysDiv.style.alignItems = "center";
    daysDiv.style.gap = "4px";

    tage.forEach(tag => {
      const dayBtn = document.createElement("button");
      dayBtn.textContent = tag;
      dayBtn.title = `${s.name} - ${tag}`;
      dayBtn.style.background = "var(--line)";
      dayBtn.style.color = "var(--ink)";
      dayBtn.style.border = "none";
      dayBtn.style.padding = "4px 6px";
      dayBtn.style.fontSize = "0.75rem";
      dayBtn.style.fontWeight = "700";
      dayBtn.style.borderRadius = "6px";
      dayBtn.style.cursor = "pointer";
      dayBtn.style.transition = "transform 0.2s, background 0.2s, filter 0.2s";

      dayBtn.addEventListener("mouseenter", () => { 
        dayBtn.style.transform = "scale(1.15)"; 
        dayBtn.style.filter = "brightness(1.2)";
      });
      dayBtn.addEventListener("mouseleave", () => { 
        dayBtn.style.transform = "scale(1)"; 
        dayBtn.style.filter = "none";
      });

      dayBtn.addEventListener("click", () => {
        schliesseWochenstatus();
        zeigeStundenDetail(s, tag);
      });

      daysDiv.append(dayBtn);
    });

    li.append(leftDiv, daysDiv);
    listeEl.append(li);
  });

  document.getElementById("wochenstatus-modal").classList.remove("hidden");
}

function schliesseWochenstatus() {
  document.getElementById("wochenstatus-modal").classList.add("hidden");
}

function zeigeStundenDetail(s, aktuellerTag) {
  document.getElementById("tages-titel").textContent = s.name;
  
  const itemData = datenbankZaehler[s.id] || {};
  document.getElementById("tages-untertitel").textContent = `Stundenstatistik für ${aktuellerTag}`;

  const chart = document.getElementById("tages-chart");
  chart.textContent = "";

  const stunden = Array.from({length: 24}, (_, i) => String(i));
  const maxVal = Math.max(1, ...stunden.map(h => getHourClicks(itemData, aktuellerTag, h)));

  stunden.forEach(h => {
    const val = getHourClicks(itemData, aktuellerTag, h);
    const col = document.createElement("div"); 
    col.className = "col"; 

    const sail = document.createElement("div"); 
    sail.className = "sail";
    sail.style.height = Math.round((val / maxVal) * 110) + "px";
    sail.style.background = val > 0 ? "var(--btn-active)" : "var(--line)";
    
    col.append(sail);
    chart.append(col);
  });

  const container = document.getElementById("tages-chart-container");
  const line = document.getElementById("hourly-line");
  const tooltip = document.getElementById("hourly-tooltip");

  container.onmousemove = (e) => {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const width = rect.width;
    
    if (x >= 0 && x <= width) {
      const ratio = Math.max(0, Math.min(1, x / width));
      const hourIndex = Math.min(23, Math.floor(ratio * 24));
      const val = getHourClicks(itemData, aktuellerTag, String(hourIndex));

      line.style.left = x + "px";
      line.style.display = "block";

      tooltip.style.left = x + "px";
      tooltip.style.top = (e.clientY - rect.top - 10) + "px";
      tooltip.textContent = `${hourIndex}:00 - ${hourIndex+1}:00 Uhr: ${val} Klicks`;
      tooltip.style.display = "block";
    }
  };

  container.onmouseleave = () => {
    line.style.display = "none";
    tooltip.style.display = "none";
  };

  document.getElementById("tages-detail-modal").classList.remove("hidden");
}

function schliesseTagesDetail() {
  document.getElementById("tages-detail-modal").classList.add("hidden");
}

function zeichne() {
  liste.textContent = "";
  const sortierteSeiten = sortiert();
  
  sortierteSeiten.forEach(({ s }, idx) => {
    let host = s.url;
    try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch (e) {}

    const li = document.createElement("li");
    li.style.animationDelay = `${idx * 0.06}s`;

    const a = document.createElement("a");
    a.className = "link"; 
    a.href = s.url; 
    a.target = "_self";
    a.rel = "noopener noreferrer";
    
    a.addEventListener("click", (e) => starteLinkAufruf(e, s));

    const ico = document.createElement("span");
    ico.className = "ico";
    if (s.bild) {
      const img = document.createElement("img");
      img.src = s.bild; 
      img.alt = "";
      img.onerror = () => { ico.textContent = s.name.charAt(0).toUpperCase(); };
      ico.append(img);
    } else {
      ico.textContent = s.name.charAt(0).toUpperCase();
    }

    const txt = document.createElement("span");
    txt.className = "txt";
    const n = document.createElement("span"); 
    n.className = "name"; 
    n.textContent = s.name;
    const d = document.createElement("span"); 
    d.className = "dom"; 
    d.textContent = host;

    txt.append(n, d);
    a.append(ico, txt);
    li.append(a);
    liste.append(li);
  });

  zeichneStats();
}

db.collection("stats").onSnapshot((snapshot) => {
  datenbankZaehler = {};
  snapshot.forEach((doc) => {
    datenbankZaehler[doc.id] = doc.data() || {};
  });
  zeichne();
});

zeichne();
</script>
