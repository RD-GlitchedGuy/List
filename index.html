<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Websites & Games</title>
<style>
/* Dunkles/Schwarzes Farbschema */
:root {
  --bg: #0a0c0b;
  --ink: #f0f4f3;
  --muted: #889993;
  --card: #141a18;
  --line: #222e2a;
  --accent: #2dd4bf;
  --btn-active: #2563eb;
  --btn-danger: #dc2626;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:32px 20px 64px}

/* Keyframe-Animationen */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Info-Modal / Overlay Styling */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  opacity: 1;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.modal-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
  animation: fadeInUp 0.3s ease forwards;
}
.modal-card h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.6rem;
  margin: 0 0 12px;
  color: var(--accent);
}
.modal-card p {
  color: var(--ink);
  font-size: 0.95rem;
  margin: 0 0 24px;
  line-height: 1.6;
  white-space: pre-line;
}
.modal-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.modal-btn {
  border: none;
  padding: 10px 20px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}
.modal-btn.primary {
  background: var(--btn-active);
  color: #ffffff;
}
.modal-btn.secondary {
  background: var(--line);
  color: var(--ink);
}
.modal-btn:hover {
  transform: scale(1.03);
  filter: brightness(1.1);
}
.modal-btn:active {
  transform: scale(0.97);
}

/* Kompakter & Zentrierter Tab-Umschalter */
.tab-container {
  display: flex;
  max-width: 320px;
  margin: 0 auto 24px;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 3px;
  border-radius: 10px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.tab-btn:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.05);
}
.tab-btn:active {
  transform: scale(0.96);
}
.tab-btn.active {
  background: var(--btn-active);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
}

h1{font-family:Georgia,"Times New Roman",serif;font-size:2.4rem;margin:0 0 6px}
p.sub{margin:0 0 32px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}

/* Animation & Hover für Listen-Einträge */
li {
  display: flex;
  align-items: stretch;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  opacity: 0;
  animation: fadeInUp 0.4s ease forwards;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
li:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

a.link{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 14px;color:inherit;text-decoration:none}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}

/* Bild-Zoom bei Hover */
.ico{flex:none;width:64px;height:64px;border-radius:10px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:1.5rem;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s ease}
li:hover .ico img {
  transform: scale(1.08);
}

.txt{min-width:0}
.name{font-weight:700;display:block}
.dom{color:var(--muted);font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

aside.stats{max-width:680px;margin:0 auto;padding:0 20px 48px}
@media (min-width:1100px){aside.stats{position:fixed;top:48px;right:24px;width:260px;max-width:none;margin:0;padding:0}}
.stats-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stats h2{font-family:Georgia,"Times New Roman",serif;font-size:1.3rem;margin:0 0 12px}
.stats .label{color:var(--muted);font-size:.85rem;margin:0}
.stats .top{font-weight:700;font-size:1.2rem;color:var(--accent);margin:2px 0 0}
.stats .top-count{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.stats .chart{display:flex;align-items:flex-end;gap:8px;height:190px}
.stats .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center}
.stats .val{font-size:.85rem;font-weight:700;margin-bottom:4px}

/* Statistik-Balken Animation */
.stats .sail {
  width: 100%;
  max-width: 44px;
  min-height: 3px;
  background: var(--accent);
  border-radius: 6px 6px 0 0;
  transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.stats .nm{font-size:.7rem;color:var(--muted);line-height:1.2;margin-top:6px;height:2.4em;overflow:hidden;word-break:break-word}
</style>

<!-- Firebase App + Firestore SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- INFO POPUP -->
<div id="info-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 id="modal-titel">Hinweis</h2>
    <p id="modal-text">Möchtest du diese Seite jetzt öffnen?</p>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="schliesseInfo()">Abbrechen</button>
      <button class="modal-btn primary" onclick="bestaetigeWeiterleitung()">Öffnen</button>
    </div>
  </div>
</div>

<main>
  <!-- ZENTRIERTER KATEGORIE UMSCHALTER -->
  <div class="tab-container" role="tablist">
    <button class="tab-btn active" id="tab-games" onclick="setKategorie('games')">Games</button>
    <button class="tab-btn" id="tab-useful" onclick="setKategorie('useful')">Nützliche Webseiten</button>
  </div>

  <h1 id="titel">Games</h1>
  <p class="sub" id="untertitel">Wähle ein Game aus</p>
  <ul id="liste"></ul>
</main>
<aside class="stats" id="stats" aria-label="Statistik"></aside>

<script>
/* ============================================================
   INFO MODAL STEUERUNG
   ============================================================ */
let zielUrl = "";
let zielId = "";

function starteLinkAufruf(e, item) {
  // Wenn zeigeInfo explizit auf false steht, direkt öffnen
  if (item.zeigeInfo === false) {
    zaehle(item.id);
    return;
  }

  // Ansonsten Klick abfangen und Modal anzeigen
  e.preventDefault();
  zielUrl = item.url;
  zielId = item.id;

  document.getElementById("modal-titel").textContent = item.name;
  document.getElementById("modal-text").textContent = item.infoText || `Du wirst zu "${item.name}" weitergeleitet. Möchtest du fortfahren?`;
  
  document.getElementById("info-modal").classList.remove("hidden");
}

function bestaetigeWeiterleitung() {
  if (zielUrl) {
    zaehle(zielId);
    // Im selben Tab/Fenster öffnen:
    window.location.href = zielUrl;
  }
  schliesseInfo();
}

function schliesseInfo() {
  document.getElementById("info-modal").classList.add("hidden");
  zielUrl = "";
  zielId = "";
}

/* ============================================================
   FIRESTORE KONFIGURATION
   ============================================================ */
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  projectId: "liste-29c5c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================================================
   SEITEN-DATEN
   ============================================================ */
const SEITEN = [
  // --- GAMES ---
  { 
    id: "ffa_shooter",          
    kategorie: "games",  
    name: "FFA Shooter",          
    url: "https://rd-glitchedguy.github.io/FFA/",                       
    bild: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAD+AQADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKrobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD65uI9hyOlVpYo5UKOoII5zWlKoZcGqTrtYiuGSO6lNnB+I/B0czvNYkI/XZ61zmjW17peqgTQsEY7GwK9XuF4DCoG0yKfEroMjkcdayeGjJ80dGfQ4fOqkaTp1dV+Jz4jduik/hTxbTHpG1dPHbRmMYQKw46VHJEyHpx6itPY2OP69d2SOaaGVeqN+VRkeorpSARyAaiktoX6xjNL2fY0ji+6OfpK2X02Js7cg1Wm0u4XlFLCk4SRtHE031M+irDWlwOsRFRNG6H5lYfhU6mqmnsxlFLg5pRG56IT+FFyrjKKeY3B5Rh+FIRg4INO4XQ2ilx9aMUXAKKX8KMUrhcSinpG7/dVjUy2c5/5ZmjUlzit2VqWrIsbj+5ilNjcAfdosyfaw7lWipJIZI/vqRTallJp7CYopaMUrgFFLiipuFwxRS0YpXFc76q1yh3AgVZpGGV4rttfQ+Ui7O5T8gsMHoamEQUYz0p1PPIBrWmki5TbI1iX8aRoc8VIODTiM8jvWjSJ5mZ89ow+ZBUUVuxOXGBWuF9aVo1PUVHs0aLEX/2Q==",
    zeigeInfo: true,
    infoText: "Achtung: Alle Inhalte auf dieser Website sind öffentlich einsehbar und nicht privat!"
  },
  { 
    id: "flight_simulator",     
    kategorie: "games",  
    name: "Flight Simulator",     
    url: "https://rd-glitchedguy.github.io/Flight-sim/",                
    bild: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTD_funnaBtOevhYKQY0RKC0b7S52W2sycNQ-Hrxzb5xw&s=10",
    zeigeInfo: false
  },
  { 
    id: "ballman",            
    kategorie: "games",  
    name: "Ballman",            
    url: "https://tewe444.github.io/ball-man/",                        
    bild: "ball-man.png",
    zeigeInfo: false
  },
  { 
    id: "crazy_games",          
    kategorie: "games",  
    name: "Crazy Games",          
    url: "https://crazygames.com",                                      
    bild: "https://play-lh.googleusercontent.com/zGvYCipVc-uIpRVf6P5maUThHJyuNE35Y-tQCQz6tYigWuxlZThhQh0Te8G0SlLi1j8PAgHds8EkL2KXkKPG=s256-rw",
    zeigeInfo: false
  },
  
  // --- NÜTZLICHE WEBSEITEN ---
  { 
    id: "live-chat",            
    kategorie: "useful", 
    name: "Live Chat",            
    url: "https://tewe444.github.io/live-chat/",                                       
    bild: "chat-icon.png",
    zeigeInfo: true,
    infoText: "Du verlässt diese Seite und wirst zu Wikipedia weitergeleitet."
  },
  {
    id: "duolingoweb",            
    kategorie: "useful", 
    name: "DuolingoWeb",            
    url: "https://www.duolingo.com/",                                       
    bild: "https://developer.android.com/static/images/distribute/stories/duolingo-icon.png?hl=de",
    zeigeInfo: false,
  },
  {
    id: "wann-ist",            
    kategorie: "useful", 
    name: "WannIst",            
    url: "wann-ist.png",                                       
    bild: "https://tewe444.github.io/wann-ist/",
    zeigeInfo: false,
  }
];

const liste = document.getElementById("liste");
const statsBox = document.getElementById("stats");
const titel = document.getElementById("titel");
const untertitel = document.getElementById("untertitel");

let aktiveKategorie = "games";
let datenbankZaehler = {};

function setKategorie(kat) {
  aktiveKategorie = kat;
  document.getElementById("tab-games").classList.toggle("active", kat === "games");
  document.getElementById("tab-useful").classList.toggle("active", kat === "useful");

  if (kat === "games") {
    titel.textContent = "Games";
    untertitel.textContent = "Wähle ein Game aus";
  } else {
    titel.textContent = "Nützliche Webseiten";
    untertitel.textContent = "Wähle eine Webseite aus";
  }

  zeichne();
}

function zaehle(id) {
  const docRef = db.collection("stats").doc(id);
  docRef.set({
    clicks: firebase.firestore.FieldValue.increment(1)
  }, { merge: true });
}

function sortiert() {
  return SEITEN
    .filter(s => s.kategorie === aktiveKategorie)
    .map((s, i) => ({ s, i, n: datenbankZaehler[s.id] || 0 }))
    .sort((a, b) => b.n - a.n || a.i - b.i);
}

function zeichneStats() {
  const rang = sortiert();
  const max = rang[0] ? rang[0].n : 0;
  const summe = rang.reduce((acc, curr) => acc + curr.n, 0);
  const isOverflow = max > 999;

  statsBox.textContent = "";
  const box = document.createElement("div"); box.className = "stats-box";
  const h = document.createElement("h2"); h.textContent = "Statistik";
  box.append(h);

  const l = document.createElement("p"); l.className = "label"; l.textContent = "Insgesamt meist genutzt";
  const t = document.createElement("p"); t.className = "top";
  const c = document.createElement("p"); c.className = "top-count";
  
  if (max > 0) {
    t.textContent = rang[0].s.name;
    if (isOverflow) {
      const topProzent = summe ? Math.round((max / summe) * 100) : 0;
      c.textContent = topProzent + "% aller Klicks";
    } else {
      c.textContent = max + "× von allen genutzt";
    }
  } else {
    t.textContent = "–";
    c.textContent = "Noch nichts aufgerufen";
  }
  box.append(l, t, c);

  const chart = document.createElement("div"); chart.className = "chart";
  for (const r of rang) {
    const col = document.createElement("div"); col.className = "col"; col.title = r.s.name;
    const val = document.createElement("span"); val.className = "val";
    
    if (isOverflow) {
      const prozent = summe ? Math.round((r.n / summe) * 100) : 0;
      val.textContent = prozent + "%";
    } else {
      val.textContent = r.n;
    }

    const sail = document.createElement("div"); sail.className = "sail";
    sail.style.height = (max ? Math.round(r.n / max * 140) : 0) + "px";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.s.name;
    col.append(val, sail, nm);
    chart.append(col);
  }
  box.append(chart);
  statsBox.append(box);
}

function zeichne() {
  liste.textContent = "";
  const sortierteSeiten = sortiert();
  
  sortierteSeiten.forEach(({ s }, idx) => {
    let host = s.url;
    try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch (e) {}

    const li = document.createElement("li");
    li.style.animationDelay = `${idx * 0.06}s`;

    const a = document.createElement("a");
    a.className = "link"; 
    a.href = s.url; 
    a.target = "_self"; // Öffnet im selben Tab
    a.rel = "noopener noreferrer";
    
    // Klick-Event fangen für Info-Steuerung
    a.addEventListener("click", (e) => starteLinkAufruf(e, s));

    const ico = document.createElement("span");
    ico.className = "ico";
    if (s.bild) {
      const img = document.createElement("img");
      img.src = s.bild; 
      img.alt = "";
      img.onerror = () => { ico.textContent = s.name.charAt(0).toUpperCase(); };
      ico.append(img);
    } else {
      ico.textContent = s.name.charAt(0).toUpperCase();
    }

    const txt = document.createElement("span");
    txt.className = "txt";
    const n = document.createElement("span"); 
    n.className = "name"; 
    n.textContent = s.name;
    const d = document.createElement("span"); 
    d.className = "dom"; 
    d.textContent = host;

    txt.append(n, d);
    a.append(ico, txt);
    li.append(a);
    liste.append(li);
  });

  zeichneStats();
}

db.collection("stats").onSnapshot((snapshot) => {
  datenbankZaehler = {};
  snapshot.forEach((doc) => {
    datenbankZaehler[doc.id] = doc.data().clicks || 0;
  });
  zeichne();
});

zeichne();
</script>
</body>
</html>
