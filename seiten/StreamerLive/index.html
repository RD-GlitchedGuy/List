<!DOCTYPE html>
<html lang="de" class="h-full bg-zinc-950 text-zinc-100 dark">
<head>
  <meta charset="UTF-8">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Live Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full flex flex-col bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white">

  <!-- Minimalist Dynamic Category Header -->
  <header class="border-b border-zinc-900 bg-zinc-950/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Dynamic Title (Rocket League Name or Minecraft Text) -->
      <div id="category-title" class="flex items-center space-x-2">
        <!-- Rendered via JS based on selected mode -->
      </div>

      <!-- Mode Selector: Strictly Exclusive (Rocket League OR Minecraft) -->
      <div class="flex items-center bg-zinc-900 p-1 rounded-xl border border-zinc-800/80">
        <button id="btn-rl" onclick="setMode('rl')" class="px-4 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all duration-150">
          Rocket League
        </button>
        <button id="btn-mc" onclick="setMode('mc')" class="px-4 py-1.5 rounded-lg text-xs font-semibold tracking-wide transition-all duration-150">
          Minecraft
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container (Full Width Rows) -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
    
    <!-- Streamers List Container -->
    <div id="streamer-list" class="space-y-2.5">
      <!-- Streamer rows dynamically inserted -->
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
