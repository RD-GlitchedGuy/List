<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sky Royale</title>
<link rel="stylesheet" href="css/style.css?v=28">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",
    "./js/actors.js": "./js/actors.js?v=28",
    "./js/audio.js": "./js/audio.js?v=28",
    "./js/bots.js": "./js/bots.js?v=28",
    "./js/bus.js": "./js/bus.js?v=28",
    "./js/cars.js": "./js/cars.js?v=28",
    "./js/combat.js": "./js/combat.js?v=28",
    "./js/effects.js": "./js/effects.js?v=28",
    "./js/emotes.js": "./js/emotes.js?v=28",
    "./js/foley.js": "./js/foley.js?v=28",
    "./js/hud.js": "./js/hud.js?v=28",
    "./js/input.js": "./js/input.js?v=28",
    "./js/inv.js": "./js/inv.js?v=28",
    "./js/items.js": "./js/items.js?v=28",
    "./js/lobby.js": "./js/lobby.js?v=28",
    "./js/loot.js": "./js/loot.js?v=28",
    "./js/main.js": "./js/main.js?v=28",
    "./js/models.js": "./js/models.js?v=28",
    "./js/movement.js": "./js/movement.js?v=28",
    "./js/music.js": "./js/music.js?v=28",
    "./js/net.js": "./js/net.js?v=28",
    "./js/party.js": "./js/party.js?v=28",
    "./js/physics.js": "./js/physics.js?v=28",
    "./js/player.js": "./js/player.js?v=28",
    "./js/settings.js": "./js/settings.js?v=28",
    "./js/skins.js": "./js/skins.js?v=28",
    "./js/sky.js": "./js/sky.js?v=28",
    "./js/state.js": "./js/state.js?v=28",
    "./js/storm.js": "./js/storm.js?v=28",
    "./js/touch.js": "./js/touch.js?v=28",
    "./js/world.js": "./js/world.js?v=28"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="fps"></div>
<div id="touch" class="hidden"></div>

<div id="hud" class="hidden">
  <div id="storm-tint"></div>
  <div id="hurt"></div>
  <div id="scope"><div class="scope-ring"></div><div class="scope-h"></div><div class="scope-v"></div></div>
  <div id="cross"><div class="dot"></div><div class="square"></div></div>
  <div id="hitmarker"></div>
  <div id="objhp"><span></span><div class="bar"><i></i></div></div>
  <div id="dmg-layer"></div>
  <div id="ping-layer"></div>

  <div id="feed"></div>
  <div id="netinfo"></div>

  <div id="mapbox">
    <canvas id="minimap" width="250" height="250"></canvas>
    <div id="stats">
      <span title="Sturm"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 5v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg><b id="st-storm">–</b></span>
      <span title="Spieler übrig"><svg viewBox="0 0 20 20"><circle cx="10" cy="6" r="4" fill="currentColor"/><path d="M2 19c0-5 3.5-7 8-7s8 2 8 7z" fill="currentColor"/></svg><b id="st-alive">0</b></span>
      <span title="Eliminierungen"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 0v6M10 14v6M0 10h6M14 10h6" stroke="currentColor" stroke-width="2"/></svg><b id="st-kills">0</b></span>
    </div>
    <div id="poi-now"></div>
  </div>

  <div id="banner"><div class="b-title"></div><div class="b-sub"></div></div>
  <div id="poi-banner"></div>
  <div id="center-msg"></div>
  <div id="sub-msg"></div>
  <div id="elim-pop"><span class="tag">Eliminiert</span><b></b><small></small></div>
  <div id="prompt"></div>
  <div id="speedo"></div>
  <div id="channel"><div class="lbl"></div><div class="bar"><i></i></div></div>

  <div id="mate-tags"></div>
  <div id="mate-box" class="hidden"></div>
  <div id="vitals">
    <div class="vrow sh"><svg viewBox="0 0 20 20"><path d="M10 1l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V4z" fill="currentColor"/></svg>
      <div class="bar"><i id="sh-bar"></i><span class="segs"></span></div><b id="sh-num">0</b><small>100</small></div>
    <div class="vrow hp"><svg viewBox="0 0 20 20"><path d="M7 1h6v6h6v6h-6v6H7v-6H1V7h6z" fill="currentColor"/></svg>
      <div class="bar"><i id="hp-bar"></i></div><b id="hp-num">100</b><small>100</small></div>
  </div>

  <div id="weaponinfo">
    <div id="wname"></div>
    <div id="wammo"><b id="mag">–</b><span id="reserve"></span></div>
  </div>
  <div id="ammo-list"></div>
  <div id="hotbar"></div>

  <div id="scoreboard" class="hidden"></div>
  <div id="bigmap-wrap" class="hidden"><canvas id="bigmap" width="860" height="860"></canvas><div class="maphint"></div></div>
</div>

<div id="menu">
  <div id="topbar">
    <div class="brand">Sky <span>Royale</span></div>
    <nav id="tabs"><button data-tab="lobby" class="sel">Lobby</button><button data-tab="skins">Skins</button></nav>
    <div class="grow"></div>
    <label class="namebox">Name <input id="name" maxlength="16" placeholder="Spieler"></label>
    <button id="btn-partytab" class="tb">Party</button>
    <button id="btn-settings" class="tb">Einstellungen</button>
  </div>
  <div id="skin-bar" class="hidden"><div id="skin-grid"></div></div>
  <div id="lobby-tags"></div>
  <div id="party-panel">
    <div class="ph"><span>Party</span><b id="party-count">1 / 12</b></div>
    <div class="pcode">Dein Code <b id="party-code">–</b><button id="party-copy" class="mini ghost">Kopieren</button></div>
    <div class="row join"><input id="code" maxlength="5" placeholder="CODE" autocomplete="off"><button id="btn-join" class="ghost">Beitreten</button></div>
    <button id="btn-leave" class="ghost hidden">Party verlassen</button>
    <div id="party-msg"></div>
  </div>
  <div id="play-panel">
    <div id="load"><div class="bar"><i id="load-bar"></i></div><span id="load-txt">Lade Map …</span></div>
    <div class="lbl">Modus <span id="lead-hint"></span></div>
    <div class="modes" id="modes"><button id="mode-solo" class="sel">Solo</button><button id="mode-duo">Duo</button><button id="mode-trio">Trio</button><button id="mode-squad">Squad</button></div>
    <div class="lbl">Spielart</div>
    <div class="modes" id="kinds"><button id="kind-pub" class="sel">Öffentlich</button><button id="kind-priv">Privat</button><button id="kind-off">Offline</button></div>
    <div id="kind-info"></div>
    <div id="queue-msg"></div>
    <button id="btn-play" disabled>Start</button>
    <div id="ready-info"></div>
  </div>
  <div id="keyhelp"></div>
  <button id="btn-credits" class="ghost">Credits</button>
  <div class="ver"><span id="ver">Version 28</span></div>
</div>

<div id="credits" class="screen hidden">
  <div class="panel wide"><h2>Credits</h2><div class="body" id="credits-body"></div><div class="row"><button id="credits-close">Schließen</button></div></div>
</div>
<div id="music-dock"></div>
<button id="music-tab" class="ghost hidden">♪ Musik</button>

<div id="pause" class="screen hidden">
  <div class="panel small">
    <h2 id="pause-title">Pause</h2>
    <button id="btn-resume">Weiter</button>
    <button id="btn-psettings" class="ghost">Einstellungen</button>
    <button id="btn-restart" class="ghost">Neue Runde</button>
    <button id="btn-pmenu" class="ghost">Hauptmenü</button>
  </div>
</div>

<div id="settings" class="screen hidden"></div>

<div id="victory" class="hidden"><div class="v1">#1</div><div class="v2">Victory Royale</div><div class="v3"></div></div>

<div id="end" class="hidden">
  <div class="end-left"><div id="end-place"></div><div id="end-title"></div><div id="end-watch"></div></div>
  <div id="end-stats"></div>
  <div class="end-btns"><button id="btn-spectate" class="ghost">Nächster Spieler</button><button id="btn-again">Nochmal spielen</button><button id="btn-menu" class="ghost">Hauptmenü</button></div>
</div>

<div id="inv" class="hidden"></div>
<div id="emote-wheel" class="hidden"></div>

<script type="module" src="js/main.js?v=28"></script>
</body>
</html>
